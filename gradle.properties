mod_description=An unofficial, modified 26.1.2 port of Enigmatic Legacy (original by Aizistral; 1.21.1 port by Auviotre).\nThis mod is designed to provide tools that will aid you in exploring seemingly endless reaches of Minecraft's worlds. As well as new resources, powerful gear and ancient relics - to reward you for doing so. Despite revolving around themes of arcane and mystery, Enigmatic Legacy doesn't stray too far away from what vanilla has to offer, instead attempting to expand upon its mechanics and fill in the holes left open.

